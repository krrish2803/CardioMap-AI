# Model Zoo Configurations and Hyperparameter Search Grids

scoring_metric: "roc_auc"
cv_inner_folds: 3
random_seed: 42

models:
  logistic_regression:
    estimator: "LogisticRegression"
    fixed_params:
      solver: "saga"
      penalty: "elasticnet"
      class_weight: "balanced"
      max_iter: 1200
      random_state: 42
    search_type: "grid"
    grid:
      classifier__C: [0.01, 0.1, 1.0, 10.0]
      classifier__l1_ratio: [0.0, 0.5, 1.0]

  random_forest:
    estimator: "RandomForestClassifier"
    fixed_params:
      n_estimators: 150
      class_weight: "balanced_subsample"
      random_state: 42
      n_jobs: 1
    search_type: "random"
    n_iter: 8
    grid:
      classifier__max_depth: [3, 5, null]
      classifier__min_samples_leaf: [3, 5, 10]
      classifier__max_features: ["sqrt", 0.3]

  xgboost:
    estimator: "XGBClassifier"
    fixed_params:
      eval_metric: "logloss"
      random_state: 42
      n_jobs: 1
      subsample: 0.8
      colsample_bytree: 0.8
    search_type: "random"
    n_iter: 8
    grid:
      classifier__max_depth: [2, 3]
      classifier__learning_rate: [0.03, 0.1]
      classifier__n_estimators: [100, 200]
      classifier__min_child_weight: [3, 5]
      classifier__reg_lambda: [1.0, 5.0]
