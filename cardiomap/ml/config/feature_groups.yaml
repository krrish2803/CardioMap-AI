# Feature Groupings and Data Types for ColumnTransformer Pipeline

groups:
  Demographic:
    description: "Baseline patient demographics and long-term systemic comorbidities"
    features:
      - name: "Age"
        type: "numeric"
        unit: "years"
      - name: "Weight"
        type: "numeric"
        unit: "kg"
      - name: "Length"
        type: "numeric"
        unit: "cm"
      - name: "Sex"
        type: "binary"
        unit: "binary (1=Male, 0=Female)"
      - name: "BMI"
        type: "numeric"
        unit: "kg/m^2"
      - name: "DM"
        type: "binary"
        description: "Diabetes Mellitus"
      - name: "HTN"
        type: "binary"
        description: "Hypertension"
      - name: "Current Smoker"
        type: "binary"
      - name: "EX-Smoker"
        type: "binary"
      - name: "FH"
        type: "binary"
        description: "Family History of CAD"
      - name: "Obesity"
        type: "binary"
      - name: "CRF"
        type: "binary"
        description: "Chronic Renal Failure"
      - name: "CVA"
        type: "binary"
        description: "Cerebrovascular Accident / Stroke"
      - name: "Airway disease"
        type: "binary"
      - name: "Thyroid Disease"
        type: "binary"
      - name: "CHF"
        type: "binary"
        description: "Congestive Heart Failure"
      - name: "DLP"
        type: "binary"
        description: "Dyslipidemia"

  "Clinical examination":
    description: "Hemodynamics, physical exam signs, and symptomatic chest pain presentation"
    features:
      - name: "BP"
        type: "numeric"
        unit: "mmHg"
      - name: "PR"
        type: "numeric"
        unit: "bpm"
      - name: "Edema"
        type: "binary"
      - name: "Weak Peripheral Pulse"
        type: "binary"
      - name: "Lung rales"
        type: "binary"
      - name: "Systolic Murmur"
        type: "binary"
      - name: "Diastolic Murmur"
        type: "binary"
      - name: "Typical Chest Pain"
        type: "binary"
      - name: "Dyspnea"
        type: "binary"
      - name: "Function Class"
        type: "ordinal"
        categories: [1, 2, 3, 4]
        description: "NYHA Functional Class (1 to 4)"
      - name: "Atypical"
        type: "binary"
        description: "Atypical Chest Pain"
      - name: "Nonanginal"
        type: "binary"
        description: "Non-anginal Chest Pain"
      - name: "Exertional CP"
        type: "binary"
      - name: "LowTH Ang"
        type: "binary"
        description: "Low Threshold Angina"

  ECG:
    description: "12-lead electrophysiology and ischemic repolarization markers"
    features:
      - name: "Q Wave"
        type: "binary"
      - name: "ST Elevation"
        type: "binary"
      - name: "ST Depression"
        type: "binary"
      - name: "Tinversion"
        type: "binary"
      - name: "LVH"
        type: "binary"
        description: "Left Ventricular Hypertrophy"
      - name: "Poor R Progression"
        type: "binary"
      - name: "BBB"
        type: "nominal"
        description: "Bundle Branch Block (N, LBBB, RBBB)"

  Laboratory:
    description: "Standard lipid fractions, glycemic markers, renal panel, and hematology"
    features:
      - name: "FBS"
        type: "numeric"
        unit: "mg/dL"
      - name: "CR"
        type: "numeric"
        unit: "mg/dL"
      - name: "TG"
        type: "numeric"
        unit: "mg/dL"
      - name: "LDL"
        type: "numeric"
        unit: "mg/dL"
      - name: "HDL"
        type: "numeric"
        unit: "mg/dL"
      - name: "BUN"
        type: "numeric"
        unit: "mg/dL"
      - name: "ESR"
        type: "numeric"
        unit: "mm/hr"
      - name: "HB"
        type: "numeric"
        unit: "g/dL"
      - name: "K"
        type: "numeric"
        unit: "mEq/L"
      - name: "Na"
        type: "numeric"
        unit: "mEq/L"
      - name: "WBC"
        type: "numeric"
        unit: "cells/mcL"
      - name: "Lymph"
        type: "numeric"
        unit: "%"
      - name: "Neut"
        type: "numeric"
        unit: "%"
      - name: "PLT"
        type: "numeric"
        unit: "x10^3/mcL"

  Echocardiography:
    description: "Structural myocardial performance and regional kinetic wall motion"
    features:
      - name: "EF-TTE"
        type: "numeric"
        unit: "%"
      - name: "Region RWMA"
        type: "nominal"
        description: "Regional Wall Motion Abnormality score / territory (0=None, 1..4=Specific segments)"
      - name: "VHD"
        type: "nominal"
        description: "Valvular Heart Disease severity (N, mild, moderate, severe)"
